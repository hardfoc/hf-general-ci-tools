---
name: 📝 [RU] Markdown Linting Tools

on:
  workflow_call:
    inputs:
      globs:
        description: 'Space-separated list of glob patterns to check (default: all markdown files)'
        required: false
        type: string
        default: '**/*.md'
      config_file:
        description: 'Path to markdownlint configuration file (default: _config/.markdownlint.json)'
        required: false
        type: string
        default: '_config/.markdownlint.json'
      exclude_patterns:
        description: 'Comma-separated patterns to exclude from checking'
        required: false
        type: string
        default: '.git/**,node_modules/**,venv/**,.venv/**,_site/**,**/hf-espidf-project-tools/**'
      use_docker:
        description: 'Use Docker container instead of official action (for more control)'
        required: false
        type: boolean
        default: false
      fix:
        description: 'Automatically fix fixable issues (equivalent to --fix flag)'
        required: false
        type: boolean
        default: false
      separator:
        description: 'Separator to use between glob patterns (default: space)'
        required: false
        type: string
        default: ''
    outputs:
      result:
        description: 'Markdown lint result (success/failure)'
        value: ${{ jobs.markdownlint.outputs.result }}
      files_checked:
        description: 'Number of files checked'
        value: ${{ jobs.markdownlint.outputs.files_checked }}
      issues_found:
        description: 'Number of issues found'
        value: ${{ jobs.markdownlint.outputs.issues_found }}

jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.consolidate.outputs.result }}
      files_checked: ${{ steps.consolidate.outputs.files_checked }}
      issues_found: ${{ steps.consolidate.outputs.issues_found }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Run markdownlint (Official Action - Simple)
        if: ${{ inputs.use_docker == false }}
        id: action_run
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e  # v20.0.0
        with:
          globs: ${{ inputs.globs }}
          config: ${{ inputs.config_file }}
          fix: ${{ inputs.fix }}
          separator: ${{ inputs.separator != '' && inputs.separator || ' ' }}
        continue-on-error: true

      - name: Process results (Official Action)
        if: ${{ inputs.use_docker == false }}
        id: action_outputs
        env:
          LINT_OUTCOME: ${{ steps.action_run.outcome }}
        run: |
          # The official action doesn't provide detailed outputs
          # Set basic outputs based on step outcome
          FILES=$(git ls-files -- '*.md' | wc -l)
          if [ "${LINT_OUTCOME}" = "success" ]; then
            {
              echo "result=success"
              echo "issues_found=0"
              echo "files_checked=$FILES"
            } >> "$GITHUB_OUTPUT"
            echo "✅ Markdown linting passed"
          else
            {
              echo "result=failure"
              echo "issues_found=1"
              echo "files_checked=$FILES"
            } >> "$GITHUB_OUTPUT"
            echo "❌ Markdown linting failed"
            exit 1
          fi

      - name: Run markdownlint (Docker - Full Control with Excludes)
        if: ${{ inputs.use_docker == true }}
        id: docker_run
        env:
          GLOBS: ${{ inputs.globs }}
          CONFIG_FILE: ${{ inputs.config_file }}
          EXCLUDE_PATTERNS: ${{ inputs.exclude_patterns }}
          LINT_FIX: ${{ inputs.fix }}
        run: |
          IMAGE="markdownlint/markdownlint-cli2:latest"

          # Convert space-separated globs to array (markdownlint-cli2 uses space-separated)
          read -r -a GLOB_ARRAY <<< "$GLOBS"
          IFS=',' read -ra EXCLUDE_ARRAY <<< "$EXCLUDE_PATTERNS"

          CONFIG_ARGS=()
          if [ -f "$CONFIG_FILE" ]; then
            echo "✅ Using markdownlint config: $CONFIG_FILE"
            CONFIG_ARGS=(--config "/workdir/$CONFIG_FILE")
          else
            echo "⚠️  No config file found at $CONFIG_FILE, using defaults"
          fi

          # Get list of files to check using markdownlint-cli2 --list
          mapfile -t ALL_FILES < <(docker run --rm -v "$PWD":/workdir "$IMAGE" \
            "${CONFIG_ARGS[@]}" --list "${GLOB_ARRAY[@]}" 2>/dev/null || true)

          # Filter out excluded patterns
          filtered_files=()
          for file in "${ALL_FILES[@]}"; do
            skip=false
            for exclude in "${EXCLUDE_ARRAY[@]}"; do
              exclude=$(echo "$exclude" | xargs)
              # Convert glob pattern to simple string match for exclusion
              if [[ "$file" == *"$exclude"* ]]; then
                echo "  🚫 Excluding: $file (matches: $exclude)"
                skip=true
                break
              fi
            done
            if [ "$skip" = false ]; then
              filtered_files+=("$file")
            fi
          done

          if [ ${#filtered_files[@]} -eq 0 ]; then
            echo "  ⚠️  No markdown files found matching patterns: $GLOBS"
            {
              echo "result=success"
              echo "files_checked=0"
              echo "issues_found=0"
            } >> "$GITHUB_OUTPUT"
            echo "✅ Markdown linting skipped (no files to lint)"
            exit 0
          fi

          echo "  ✅ ${#filtered_files[@]} files to lint:"
          for file in "${filtered_files[@]}"; do
            echo "    - $file"
          done

          FILES_CHECKED=${#filtered_files[@]}
          echo "🔍 Running markdownlint-cli2 on $FILES_CHECKED files..."

          LINT_ARGS=("${CONFIG_ARGS[@]}")
          if [ "$LINT_FIX" = "true" ]; then
            LINT_ARGS+=(--fix)
          fi

          if docker run --rm -v "$PWD":/workdir "$IMAGE" "${LINT_ARGS[@]}" "${filtered_files[@]}" 2>&1; then
            ISSUES_FOUND=0
            RESULT=success
          else
            ISSUES_FOUND=1
            RESULT=failure
          fi

          {
            echo "result=$RESULT"
            echo "files_checked=$FILES_CHECKED"
            echo "issues_found=$ISSUES_FOUND"
          } >> "$GITHUB_OUTPUT"

          echo "📊 Summary:"
          echo "  Files checked: $FILES_CHECKED"
          echo "  Issues found: $ISSUES_FOUND"
          echo "  Result: $RESULT"

          if [ "$ISSUES_FOUND" -gt 0 ]; then
            echo "❌ Failing due to markdown linting errors"
            exit 1
          fi

      - name: Consolidate outputs
        id: consolidate
        if: always()
        env:
          RESULT: ${{ inputs.use_docker && steps.docker_run.outputs.result || steps.action_outputs.outputs.result }}
          FILES_CHECKED: ${{ inputs.use_docker && steps.docker_run.outputs.files_checked || steps.action_outputs.outputs.files_checked }}
          ISSUES_FOUND: ${{ inputs.use_docker && steps.docker_run.outputs.issues_found || steps.action_outputs.outputs.issues_found }}
        run: |
          # Consolidate outputs from either the official action or Docker path
          {
            echo "result=${RESULT}"
            echo "files_checked=${FILES_CHECKED}"
            echo "issues_found=${ISSUES_FOUND}"
          } >> "$GITHUB_OUTPUT"
