---
name: 📚 Docs Publish CI

on:
  push:
    branches: [main, 'release/*']  # Run on main and release branches
    tags: ['v*']  # Run on version tags
  pull_request:
    branches: [main]  # Only run on PRs targeting main branch
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-versioned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-docs:
    uses: ./.github/workflows/ru-docs-publish.yml
    with:
      # =============================================================================
      # Versioning Configuration (Always Enabled)
      # =============================================================================
      deployment_branch: 'gh-pages'  # Required for versioned documentation
      # =============================================================================
      # Doxygen Configuration
      # =============================================================================
      doxygen_config: "_config/Doxyfile"

      # =============================================================================
      # Jekyll Configuration
      # =============================================================================
      jekyll_enabled: true
      jekyll_config: "_config/_config.yml"
      jekyll_source: "."
      jekyll_destination: "_site"
      jekyll_layouts_dir: "_config/_layouts"

      # =============================================================================
      # Quality Assurance
      # =============================================================================
      run_link_check: true
      link_check_paths: "**/*.md"
      verbose: true

      # Markdown linting
      run_markdown_lint: true
      markdown_lint_paths: "**/*.md"

      # Spell checking
      run_spell_check: false
      spell_check_paths: "**/*.md"

      # =============================================================================
      # GitHub Pages Deployment
      # =============================================================================
      deploy_pages: ${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) }}

  # Self-test: a site whose Jekyll source is a subdirectory with its config
  # inside it (the layout product repos use with docs/), plus a Doxyfile whose
  # OUTPUT_DIRECTORY parent does not exist. Never deploys.
  selftest-site-in-subdir:
    uses: ./.github/workflows/ru-docs-publish.yml
    with:
      doxygen_config: "tests/fixtures/site-in-subdir/Doxyfile"
      jekyll_enabled: true
      jekyll_source: "tests/fixtures/site-in-subdir"
      jekyll_config: "tests/fixtures/site-in-subdir/_config/_config.yml"
      jekyll_destination: "_site_selftest"
      run_link_check: false
      run_markdown_lint: false
      run_spell_check: false
      deploy_pages: false
      artifact_name: "docs-html-selftest-subdir"

  # Self-test of ru-mkdocs-publish with versioning: false on the organisation-site fixture of the theme package: the
  # strict build, the plugin's unversioned switch and the offline link check, through the real workflow. Never
  # deploys (pull requests never deploy, and deploy is false).
  selftest-mkdocs-unversioned:
    uses: ./.github/workflows/ru-mkdocs-publish.yml
    permissions:
      contents: write
    with:
      mkdocs_config: packages/hardfoc-mkdocs-theme/tests/fixtures/org-site/mkdocs.yml
      check_commands: ""
      versioning: false
      lighthouse: false
      screenshots: false
      deploy: false
