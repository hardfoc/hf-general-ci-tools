---
# Keeps the SHA-pinned actions in .github/workflows current. Dependabot
# rewrites both the SHA and the trailing `# vX.Y.Z` comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The documentation toolchain pinned by the theme package (mkdocs, mkdocs-material, mike, ...).
  - package-ecosystem: pip
    directory: /packages/hardfoc-mkdocs-theme
    schedule:
      interval: weekly
    groups:
      docs-toolchain:
        patterns: ["*"]
    commit-message:
      prefix: docs
