---
# Self-test fixture for ru-docs-publish: a Jekyll site whose source is a
# subdirectory (jekyll_source != "."), with its config inside that source.
# Mirrors product repos that keep their site under docs/.
title: "Docs publish self-test (site in a subdirectory)"
description: "Fixture used by the tools repository's own CI"
baseurl: "/hf-general-ci-tools"
url: "https://hardfoc.github.io"

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter

# just-the-docs requires each callout to be a mapping with a color; the
# pre-flight check in ru-docs-publish rejects the `note: blue` shorthand.
callouts:
  note:
    title: Note
    color: blue

exclude:
  - Doxyfile
  - src
