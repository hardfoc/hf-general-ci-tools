<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="816" viewBox="0 0 1200 816" role="img" aria-labelledby="driver-layers-title driver-layers-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-layers-title">Three layers, one of them yours</title>
<desc id="driver-layers-desc">Layer diagram: the application calls the hardware-agnostic driver, which calls the communication interface, which the platform port implements with the MCU's SDK, which talks to the chip.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="815" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#3730A3">ARCHITECTURE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#17202C">Three layers, one of them yours</text>
<text x="32" y="115.4" font-size="18" fill="#566070">The driver and the interface are the same on every MCU; the port is a small class.</text>
<rect x="32" y="131.4" width="1136" height="1" fill="#E2E7EE"/>
<path d="M600 242.4 L600 274.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 371.4 L600 403.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 499.4 L600 531.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 628.4 L600 660.4" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="149.4" width="1136" height="89" rx="12" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/>
<rect x="32" y="157.4" width="4" height="73" rx="2" fill="#64748B"/>
<rect x="32" y="278.4" width="1136" height="89" rx="12" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.4"/>
<rect x="32" y="286.4" width="4" height="73" rx="2" fill="#4F46E5"/>
<rect x="32" y="407.4" width="1136" height="88" rx="12" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/>
<rect x="32" y="415.4" width="4" height="72" rx="2" fill="#4F46E5"/>
<rect x="32" y="535.4" width="1136" height="89" rx="12" fill="#E6F6F4" stroke="#0F8B80" stroke-width="1.4"/>
<rect x="32" y="543.4" width="4" height="73" rx="2" fill="#0F8B80"/>
<rect x="32" y="664.4" width="1136" height="89" rx="12" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/>
<rect x="32" y="672.4" width="4" height="73" rx="2" fill="#64748B"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#17202C">Your application</text>
<text x="56" y="215" font-size="17" fill="#2B3442">control loop, state machine, CLI</text>
<text x="56" y="313.4" font-size="20" font-weight="700" fill="#3730A3">Hardware-agnostic core</text>
<text x="56" y="344" font-size="17" fill="#2B3442">Driver&lt;Comm&gt;: configure, read, write, errors</text>
<text x="56" y="442.4" font-size="20" font-weight="700" fill="#17202C">Communication interface</text>
<text x="56" y="471.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">transfer(), gpioSet(), delayUs()</text>
<text x="56" y="570.4" font-size="20" font-weight="700" fill="#115E59">Platform port (your class)</text>
<text x="56" y="601" font-size="17" fill="#2B3442">ESP-IDF, STM32 HAL, Zephyr, Linux</text>
<text x="56" y="699.4" font-size="20" font-weight="700" fill="#17202C">The chip</text>
<text x="56" y="730" font-size="17" fill="#2B3442">SPI / I2C / UART and control pins</text>
<rect x="32" y="765.8" width="14" height="14" rx="4" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.4"/>
<text x="54" y="780.4" font-size="16" fill="#566070">this library</text>
<rect x="161.8" y="765.8" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0F8B80" stroke-width="1.4"/>
<text x="183.8" y="780.4" font-size="16" fill="#566070">you write</text>
<rect x="282.1" y="765.8" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="304.1" y="780.4" font-size="16" fill="#566070">hardware</text>
</svg>
