<path d="M600 499.4 L600 531.4" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M600 628.4 L600 660.4" fill="none" stroke="#6C7889" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="149.4" width="1136" height="89" rx="12" fill="#151C26" stroke="#3A4657" stroke-width="1"/>
<rect x="32" y="157.4" width="4" height="73" rx="2" fill="#94A3B8"/>
<rect x="32" y="278.4" width="1136" height="89" rx="12" fill="#1C1F3D" stroke="#8C93FF" stroke-width="1.4"/>
