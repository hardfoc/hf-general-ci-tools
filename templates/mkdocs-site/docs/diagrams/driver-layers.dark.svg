<rect x="32" y="535.4" width="1136" height="89" rx="12" fill="#0F2A28" stroke="#2DD4BF" stroke-width="1.4"/>
<rect x="32" y="543.4" width="4" height="73" rx="2" fill="#2DD4BF"/>
<rect x="32" y="664.4" width="1136" height="89" rx="12" fill="#151C26" stroke="#3A4657" stroke-width="1"/>
<rect x="32" y="672.4" width="4" height="73" rx="2" fill="#94A3B8"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#E8EDF3">Your application</text>
<text x="56" y="215" font-size="17" fill="#D2DAE4">control loop, state machine, CLI</text>
<text x="56" y="313.4" font-size="20" font-weight="700" fill="#C7CBFF">Hardware-agnostic core</text>
<text x="56" y="344" font-size="17" fill="#D2DAE4">Driver&lt;Comm&gt;: configure, read, write, errors</text>
<text x="56" y="442.4" font-size="20" font-weight="700" fill="#E8EDF3">Communication interface</text>
<text x="56" y="471.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">transfer(), gpioSet(), delayUs()</text>
<text x="56" y="570.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform port (your class)</text>
<text x="56" y="601" font-size="17" fill="#D2DAE4">ESP-IDF, STM32 HAL, Zephyr, Linux</text>
<text x="56" y="699.4" font-size="20" font-weight="700" fill="#E8EDF3">The chip</text>
<text x="56" y="730" font-size="17" fill="#D2DAE4">SPI / I2C / UART and control pins</text>
<rect x="32" y="765.8" width="14" height="14" rx="4" fill="#1C1F3D" stroke="#8C93FF" stroke-width="1.4"/>
<text x="54" y="780.4" font-size="16" fill="#9AA6B5">this library</text>
<rect x="161.8" y="765.8" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2DD4BF" stroke-width="1.4"/>
<text x="183.8" y="780.4" font-size="16" fill="#9AA6B5">you write</text>
<rect x="282.1" y="765.8" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="304.1" y="780.4" font-size="16" fill="#9AA6B5">hardware</text>
</svg>
