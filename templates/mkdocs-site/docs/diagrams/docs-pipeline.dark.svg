<text x="656" y="215" font-size="17" fill="#D2DAE4">build --strict</text>
<text x="656" y="375.4" font-size="20" font-weight="700" fill="#E8EDF3">Doxygen</text>
<text x="656" y="406" font-size="17" fill="#D2DAE4">API under api/</text>
