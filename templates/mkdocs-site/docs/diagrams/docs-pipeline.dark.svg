<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#C7CBFF">DOCUMENTATION PIPELINE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">From code to site</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">Everything a reader sees is either written once or generated from the code, and CI checks both.</text>
