<text x="56" y="213.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">docs/**/*.md</text>
<text x="56" y="312.4" font-size="20" font-weight="700" fill="#E8EDF3">Code</text>
<text x="56" y="343" font-size="17" fill="#D2DAE4">headers, tables,</text>
<text x="56" y="367.7" font-size="17" fill="#D2DAE4">YAML</text>
