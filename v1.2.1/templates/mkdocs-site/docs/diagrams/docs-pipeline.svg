<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492" role="img" aria-labelledby="docs-pipeline-title docs-pipeline-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="docs-pipeline-title">From code to site</title>
<desc id="docs-pipeline-desc">Pages and code feed figkit and the table generator, MkDocs builds the site in strict mode, the Doxygen API is merged in, links are checked and mike publishes to gh-pages.</desc>
<defs><marker id="fk-arrow-blue-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="fk-arrow-brand-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4F46E5"/></marker><marker id="fk-arrow-violet-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="491" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#3730A3">DOCUMENTATION PIPELINE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#17202C">From code to site</text>
<text x="32" y="115.4" font-size="18" fill="#566070">Everything a reader sees is either written once or generated from the code, and CI checks both.</text>
