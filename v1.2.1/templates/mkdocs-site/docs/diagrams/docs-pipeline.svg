<text x="656" y="215" font-size="17" fill="#2B3442">build --strict</text>
<text x="656" y="375.4" font-size="20" font-weight="700" fill="#17202C">Doxygen</text>
<text x="656" y="406" font-size="17" fill="#2B3442">API under api/</text>
