<text x="56" y="213.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">docs/**/*.md</text>
<text x="56" y="312.4" font-size="20" font-weight="700" fill="#17202C">Code</text>
<text x="56" y="343" font-size="17" fill="#2B3442">headers, tables,</text>
<text x="56" y="367.7" font-size="17" fill="#2B3442">YAML</text>
