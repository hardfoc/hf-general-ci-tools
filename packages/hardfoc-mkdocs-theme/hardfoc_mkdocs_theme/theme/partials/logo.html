{#- HardFOC: the mark is inlined (no request, crisp at any size) on a translucent tile, so it reads on the brand-coloured
    header in both schemes; the link around it carries the accessible name. -#}
{% if config.theme.logo and config.theme.logo != "assets/hardfoc/mark.svg" %}
  <img src="{{ config.theme.logo | url }}" alt="" width="24" height="24">
{% else %}
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false" class="hf-mark">
    <rect width="64" height="64" rx="15" fill="#FFFFFF" fill-opacity="0.14"/>
    <g fill="none" stroke-width="5" stroke-linecap="round">
      <path d="M35.74 14.39A18 18 0 0 1 49.12 37.56" stroke="#FFFFFF"/>
      <path d="M45.38 44.04A18 18 0 0 1 18.62 44.04" stroke="#FFFFFF" stroke-opacity="0.72"/>
      <path d="M14.88 37.56A18 18 0 0 1 28.26 14.39" stroke="#5EEAD4"/>
      <path d="M32 32L40.66 27" stroke="#5EEAD4" stroke-width="4.5"/>
    </g>
    <circle cx="32" cy="32" r="4" fill="#FFFFFF"/>
  </svg>
{% endif %}
